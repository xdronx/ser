<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>МебельВставка</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="rail">
        <div class="brand">
          <div class="brand-icon">F</div>
          <div class="brand-name">Мебель</div>
        </div>

        <nav class="rail-nav">
          <button type="button" class="rail-btn active">Мебель</button>
          <button type="button" class="rail-btn">Стили</button>
          <button type="button" class="rail-btn">Сцены</button>
          <button type="button" class="rail-btn">Фото</button>
        </nav>

        <div class="rail-help">Помощь</div>
      </aside>

      <section class="catalog">
        <header class="catalog-head">
          <h2>Мебель</h2>
          <p class="catalog-sub">Выбери предмет и поставь его в комнату</p>
        </header>

        <div class="catalog-search">
          <input id="searchInput" type="search" placeholder="Поиск мебели..." />
        </div>

        <div id="categoryTabs" class="chips"></div>

        <div id="furnitureGrid" class="furniture-grid"></div>

        <footer class="catalog-footer">
          <div class="catalog-upload">
            <input id="newFurnitureName" type="text" placeholder="Название (например: Стул 2)" />
            <input id="newFurnitureCategory" type="text" placeholder="Категория: chair/table" value="chair" />
            <input id="newFurnitureImage" type="file" accept=".png,.jpg,.jpeg,.webp" />
            <button id="uploadFurnitureBtn" type="button">Добавить предмет</button>
            <p id="uploadStatusText">Можно добавить свои реальные предметы.</p>
          </div>
        </footer>
      </section>

      <section class="workspace">
        <header class="toolbar">
          <div class="toolbar-left">
            <label class="ghost-btn upload-room">
              <input id="roomImageInput" type="file" accept=".jpg,.jpeg,.png,.webp" />
              <span>Загрузить фото</span>
            </label>
            <button id="clearBtn" class="ghost-btn" type="button">Очистить</button>
          </div>

          <div class="toolbar-right">
            <a id="downloadLink" class="download-btn" href="#" download hidden>Скачать результат</a>
            <button id="renderBtn" class="primary-btn" type="button" disabled>Сгенерировать</button>
          </div>
        </header>

        <section id="renderProgressWrap" class="render-progress" hidden>
          <div class="render-progress-top">
            <span id="renderProgressLabel">Нейросеть работает...</span>
            <strong id="renderProgressPercent">0%</strong>
          </div>
          <div class="render-progress-track">
            <div id="renderProgressBar" class="render-progress-bar"></div>
          </div>
        </section>

        <div class="workspace-main">
          <div class="canvas-wrap">
            <div class="canvas-surface">
              <img id="roomPreview" alt="Комната" />
              <img id="resultImage" alt="Результат генерации" />
              <div id="marker" class="marker" hidden></div>
              <div id="snapGuideV" class="snap-guide snap-guide-v" hidden></div>
              <div id="snapGuideH" class="snap-guide snap-guide-h" hidden></div>
              <div id="sceneObjectsLayer" class="scene-objects-layer"></div>
              <div id="emptyHint" class="hint-empty">Загрузи фото комнаты, чтобы начать</div>
            </div>
          </div>

          <aside class="layers-panel">
            <header class="layers-head">
              <h3>Слои</h3>
              <p>Активный слой выделен. Меняй порядок вручную.</p>
            </header>
            <div id="layersEmpty" class="layers-empty">Добавь объекты на сцену</div>
            <div id="layersList" class="layers-list"></div>
          </aside>
        </div>

        <footer class="bottom-status">
          <p id="statusText">Подготовка...</p>
          <p id="coordsText">Точка не выбрана</p>
        </footer>
      </section>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
